<?xml version="1.0" ?>
<!-- AMDuProfPcm counter config for the cache- and TLB-miss experiments (Zen / Zen+, family 17h).
     Based on <uProf>\bin\Data\Config\0x17_0x0.conf. Zen+ has 6 core counters, so the events
     are split into two groups that PCM time-multiplexes (and scales). Each group has its
     own instruction and cycle counts so ratios within a group stay consistent.
     Metrics without a '$' prefix are printed as raw totals; per-element values are
     computed by run_cachemiss_pcm.ps1 and run_tlb_pcm.ps1. -->
<event_configuration family="17" modellow="00" modelhigh="0f" version="2">

    <core subtype="cache">
        <event id="C0" mask="00" os="T" user="T" name="$Inst1"> </event>
        <event id="76" mask="00" os="T" user="T" name="$Cyc1"> </event>
        <event id="43" mask="5B" os="T" user="T" name="$DcRefillAll"> </event>
        <event id="60" mask="C8" os="T" user="T" name="$L2ReqFromDc"> </event>
        <event id="64" mask="08" os="T" user="T" name="$L2MissFromDc"> </event>
        <event id="43" mask="48" os="T" user="T" name="$DcRefillDram1"> </event>

        <metric name="instructions_g1" expression="$Inst1"> </metric>
        <metric name="cycles_g1" expression="$Cyc1"> </metric>
        <metric name="l1d_demand_refills" expression="$DcRefillAll"> </metric>
        <metric name="l2_requests_from_l1d" expression="$L2ReqFromDc"> </metric>
        <metric name="l2_misses_from_l1d" expression="$L2MissFromDc"> </metric>
        <metric name="l1d_refills_from_dram_g1" expression="$DcRefillDram1"> </metric>
    </core>

    <core subtype="tlb">
        <event id="C0" mask="00" os="T" user="T" name="$Inst2"> </event>
        <event id="76" mask="00" os="T" user="T" name="$Cyc2"> </event>
        <event id="45" mask="FF" os="T" user="T" name="$L1DtlbMiss"> </event>
        <event id="45" mask="F0" os="T" user="T" name="$L2DtlbMiss"> </event>
        <event id="43" mask="12" os="T" user="T" name="$DcRefillL3"> </event>
        <event id="43" mask="01" os="T" user="T" name="$DcRefillL2"> </event>

        <metric name="instructions_g2" expression="$Inst2"> </metric>
        <metric name="cycles_g2" expression="$Cyc2"> </metric>
        <metric name="l1_dtlb_misses" expression="$L1DtlbMiss"> </metric>
        <metric name="l2_dtlb_misses" expression="$L2DtlbMiss"> </metric>
        <metric name="l1d_refills_from_l3_or_other_ccx" expression="$DcRefillL3"> </metric>
        <metric name="l1d_refills_from_l2" expression="$DcRefillL2"> </metric>
    </core>

</event_configuration>
